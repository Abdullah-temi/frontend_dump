<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Abdullah</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="wrapper">
    <div class="login-box">
        <form action="">
            <h2>Login</h2>
            <div class="input-box">
                <span class="icon">
                    <i class="fa-solidfa-user"></i>
                </span>
                <input type="text"required>
                <label>Username</label>
            </div>
            <div class="input-box">
                <span class="icon">
                    <i class="fa-solidfa-lock"></i>
                </span>
                <input type="password"required>
                <label>Password</label>
            </div>
            <div class="remember-forgot">
                <div class="remember_me">
                <input name="remember_me_checkbox" type="checkbox"> 
                <label id="remember_me_checkbox_label" for="remember_me_checkbox"> Remember me </label>
                </div>

                <a href="#">Forgot Password?</a>
            </div>
            <button type="submit">Login</button>
            <div class="register-link">
                <p>
                    Don't have an account?
                    <a href="#">Register</a>
                </p>
            </div>
        </form>    
</div>
</body>
</html>
